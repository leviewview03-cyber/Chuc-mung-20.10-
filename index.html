<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Quỳnh - 20/10 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ffe3e3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            color: #4a4a4a;
        }
<audio id="bgMusic" loop preload="auto">
    <source src="https://www.youtube.com/watch?v=SIxXaXF09oI&list=RDheMYSOZoT3c&index=3" type="audio/mpeg">
</audio>
        /* Hiệu ứng cánh hoa rơi nền */
        .petal {
            position: absolute;
            top: -10vh;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 150% 0 150% 0;
            animation: fall linear infinite;
            z-index: 1;
        }
        @keyframes fall {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) translateX(50px) rotate(360deg);
                opacity: 0.2;
            }
        }

        /* Container chính */
        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px 25px;
            box-shadow: 0 15px 35px rgba(214, 51, 132, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.8);
            text-align: center;
            transition: all 0.5s ease;
        }

        /* Thanh tiến trình */
        .progress-bar {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 25px;
        }
        .progress-dot {
            width: 8px;
            height: 8px;
            border-radius: 4px;
            background: #ffd1dc;
            transition: 0.3s;
        }
        .progress-dot.active {
            width: 24px;
            background: #d63384;
        }

        /* Màn hình mở đầu (Cover) */
        .cover-screen h1 {
            font-size: 1.8rem;
            color: #d63384;
            margin-bottom: 10px;
        }
        .cover-screen p {
            font-size: 1rem;
            color: #666;
            margin-bottom: 25px;
        }

        /* Thẻ nội dung từng bước */
        .card-content {
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            line-height: 1.7;
            color: #333;
            margin-bottom: 25px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Nút bấm chung */
        .btn {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 117, 140, 0.4);
            transition: all 0.3s ease;
            font-family: 'Quicksand', sans-serif;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 117, 140, 0.6);
        }
        .btn:active {
            transform: translateY(0);
        }

        /* Nút âm thanh góc màn hình */
        .audio-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #ff7eb3;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            font-size: 18px;
        }

        .hidden {
            display: none !important;
        }

        .heart-icon {
            font-size: 50px;
            margin-bottom: 15px;
            animation: beat 1.2s infinite alternate;
        }
        @keyframes beat {
            to { transform: scale(1.15); }
        }
    </style>
</head>
<body>

    <!-- Nút bật/tắt nhạc -->
    <div class="audio-control" id="audioToggle" onclick="toggleAudio()" title="Bật/Tắt nhạc">🎵</div>

    <!-- Nhạc nền (Sử dụng link nhạc trực tuyến nhẹ nhàng) -->
    <audio id="bgMusic" loop>
        <source src="https://assets.mixkit.co/music/preview/mixkit-sweet-love-121.mp3" type="audio/mpeg">
    </audio>

    <div class="container" id="mainContainer">
        <!-- Màn hình chờ ban đầu -->
        <div class="cover-screen" id="coverScreen">
            <div class="heart-icon">💖</div>
            <h1>Dành tặng Quỳnh</h1>
            <p>Nhấn vào nút bên dưới để mở món quà nhỏ này nha ✨</p>
            <button class="btn" onclick="startExperience()">Chạm để mở quà 🎁</button>
        </div>

        <!-- Màn hình nội dung các bước (Ẩn ban đầu) -->
        <div class="step-screen hidden" id="stepScreen">
            <div class="progress-bar" id="progressBar">
                <div class="progress-dot active"></div>
                <div class="progress-dot"></div>
                <div class="progress-dot"></div>
                <div class="progress-dot"></div>
                <div class="progress-dot"></div>
                <div class="progress-dot"></div>
            </div>

            <div class="card-content" id="cardContent">
                <!-- Nội dung sẽ được cập nhật bằng JavaScript -->
            </div>

            <button class="btn" id="nextBtn" onclick="nextStep()">Tiếp tục ➔</button>
        </div>
    </div>

    <!-- Thư viện hiệu ứng pháo hoa -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <script>
        const messages = [
            "Nay 20/10 - ngày dành tôn vinh nữ giới, xin lỗi vì mấy nay tui bận quá và hong có được chỉn chu trong việc chuẩn bị một phần quà nhỏ dành cho bà.",
            "Có lẽ thời gian gần đây tui với bà cũng hong có nói chuyện hoặc gặp gỡ nhau nhiều...",
            "Tui biết tình cảm mà tui dành cho bà mấy tháng nay hong biết bà có cảm xúc gì hoặc có phản hồi gì hong...",
            "Nhưng tui vẫn mong người con gái mà tui để ý sẽ mãi hạnh phúc, mạnh khoẻ...",
            "Lưu ý phải nghe lời tui dặn nha: phải ăn uống đủ bữa, hong có gồng gánh công việc quá nhiều nữa vì thế rất dễ nhập viện nữa đó...",
            "Đơn giản là chỉ muốn gửi chút tình cảm của tui dành 20/10 cho Quỳnh và mong Quỳnh thông cảm cho tui vì sự chưa chỉn chu lần này... tui sẽ bù cho bà vào những lần sau nếu có cơ hội! 💖"
        ];

        let currentStep = 0;
        const bgMusic = document.getElementById('bgMusic');
        const audioToggle = document.getElementById('audioToggle');
        let isPlaying = false;

        function startExperience() {
            // Phát nhạc
            bgMusic.play().then(() => {
                isPlaying = true;
                audioToggle.textContent = "🔊";
            }).catch(e => console.log("Audio play blocked"));

            // Chuyển màn hình
            document.getElementById('coverScreen').classList.add('hidden');
            document.getElementById('stepScreen').classList.remove('hidden');
            
            updateCard();
        }

        function toggleAudio() {
            if (isPlaying) {
                bgMusic.pause();
                audioToggle.textContent = "🔇";
                isPlaying = false;
            } else {
                bgMusic.play();
                audioToggle.textContent = "🔊";
                isPlaying = true;
            }
        }

        function updateCard() {
            document.getElementById('cardContent').textContent = messages[currentStep];
            
            // Cập nhật thanh progress dots
            const dots = document.querySelectorAll('.progress-dot');
            dots.forEach((dot, index) => {
                if (index === currentStep) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });

            // Nếu là câu cuối cùng, đổi tên nút
            const nextBtn = document.getElementById('nextBtn');
            if (currentStep === messages.length - 1) {
                nextBtn.textContent = "Hoàn tất ✨";
            }
        }

        function nextStep() {
            currentStep++;
            if (currentStep < messages.length) {
                updateCard();
            } else {
                // Hiệu ứng pháo hoa khi kết thúc
                triggerFireworks();
                // Hiển thị thông báo kết thúc nhẹ nhàng
                document.getElementById('stepScreen').innerHTML = `
                    <div class="heart-icon">💌</div>
                    <h2 style="color: #d63384; margin-bottom: 15px;">Chúc Quỳnh 20/10 thật vui!</h2>
                    <p style="line-height: 1.6; margin-bottom: 25px; color: #555;">Cảm ơn Quỳnh vì đã đọc đến đây nhé.</p>
                    <a href="https://zalo.me" target="_blank" class="btn">Nhắn lại cho tui nhé 😉</a>
                `;
            }
        }

        function triggerFireworks() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 1000 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }
                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        // Tạo hiệu ứng cánh hoa rơi
        function createPetals() {
            const petalCount = 15;
            for (let i = 0; i < petalCount; i++) {
                const petal = document.createElement('div');
                petal.classList.add('petal');
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.top = -10 + 'vh';
                petal.style.width = Math.random() * 10 + 10 + 'px';
                petal.style.height = petal.style.width;
                petal.style.animationDuration = Math.random() * 5 + 5 + 's';
                petal.style.animationDelay = Math.random() * 5 + 's';
                document.body.appendChild(petal);
            }
        }
        createPetals();
    </script>
</body>
</html>
